<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Tier-1 Deflection Assistant architecture</title>
<desc>Clients call one entry point, handle_ticket, which runs a pre-guard, a budgeted agent loop and a post-guard. The agent loop calls an LLM gateway and two MCP servers, which read a Groq model, a SQLite database and a vector index. Tracing and redaction span every hop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
</defs>
<rect width="680" height="620" fill="#FFFFFF"/>

<g class="gray"><rect x="60" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="48" text-anchor="middle" dominant-baseline="central">Angular workspace</text>
<text class="ts" x="160" y="66" text-anchor="middle" dominant-baseline="central">queue, review, insights</text></g>
<g class="gray"><rect x="420" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="48" text-anchor="middle" dominant-baseline="central">CLI and eval suite</text>
<text class="ts" x="520" y="66" text-anchor="middle" dominant-baseline="central">python -m tier1</text></g>
<g class="gray"><rect x="60" y="106" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="124" text-anchor="middle" dominant-baseline="central">FastAPI router</text>
<text class="ts" x="160" y="142" text-anchor="middle" dominant-baseline="central">thin, no logic</text></g>

<line x1="160" y1="86" x2="160" y2="104" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="162" x2="160" y2="194" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="86" x2="520" y2="194" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="196" width="600" height="116" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="216" text-anchor="middle" dominant-baseline="central">Single entry point: handle_ticket()</text></g>
<g class="teal"><rect x="60" y="232" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="250" text-anchor="middle" dominant-baseline="central">Pre-guard</text>
<text class="ts" x="140" y="268" text-anchor="middle" dominant-baseline="central">no model call</text></g>
<g class="teal"><rect x="260" y="232" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">Agent loop</text>
<text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">budgeted, 3 tools</text></g>
<g class="teal"><rect x="460" y="232" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="250" text-anchor="middle" dominant-baseline="central">Post-guard</text>
<text class="ts" x="540" y="268" text-anchor="middle" dominant-baseline="central">citations, windows</text></g>
<line x1="220" y1="260" x2="258" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="260" x2="458" y2="260" class="arr" marker-end="url(#arrow)"/>

<path d="M340 288 V330 H145 V348" class="arr" marker-end="url(#arrow)"/>
<path d="M340 288 V330 H535 V348" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="288" x2="340" y2="348" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="60" y="350" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="368" text-anchor="middle" dominant-baseline="central">LLM gateway</text>
<text class="ts" x="145" y="386" text-anchor="middle" dominant-baseline="central">cache, token limiter</text></g>
<g class="teal"><rect x="255" y="350" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="368" text-anchor="middle" dominant-baseline="central">MCP: tier1-tools</text>
<text class="ts" x="340" y="386" text-anchor="middle" dominant-baseline="central">order, plan, handoff</text></g>
<g class="teal"><rect x="450" y="350" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="368" text-anchor="middle" dominant-baseline="central">MCP: help-centre</text>
<text class="ts" x="535" y="386" text-anchor="middle" dominant-baseline="central">hybrid search</text></g>

<line x1="145" y1="406" x2="145" y2="438" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="406" x2="340" y2="438" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="406" x2="535" y2="438" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="60" y="440" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="458" text-anchor="middle" dominant-baseline="central">Groq model API</text>
<text class="ts" x="145" y="476" text-anchor="middle" dominant-baseline="central">free tier</text></g>
<g class="gray"><rect x="255" y="440" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="458" text-anchor="middle" dominant-baseline="central">SQLite tier1.db</text>
<text class="ts" x="340" y="476" text-anchor="middle" dominant-baseline="central">orders, spans, queue</text></g>
<g class="gray"><rect x="450" y="440" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="458" text-anchor="middle" dominant-baseline="central">Vector index</text>
<text class="ts" x="535" y="476" text-anchor="middle" dominant-baseline="central">Chroma plus BM25</text></g>

<rect x="40" y="522" width="600" height="56" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="340" y="541" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Tracing and PII redaction on every hop</text>
<text class="ts" x="340" y="561" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">One trace_id, a span per step, personal data scrubbed at each sink</text>

<text class="ts" x="40" y="604" fill="#5F5E5A">Purple: the single entry point. Teal: logic we wrote. Gray: clients and stored data.</text>
</svg>

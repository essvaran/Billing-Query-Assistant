<svg xmlns="http://www.w3.org/2000/svg" width="920" height="840" viewBox="0 0 920 840" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Tier-1 Deflection Assistant architecture</title>
<desc>The Angular workspace calls thin FastAPI routers; they and the CLI call one entry point, handle_ticket, which runs a pre-guard, a code prefetch, a budgeted agent loop and a post-guard, then answers or escalates. Prompts, guard rules and settings come from a versioned catalog. The agent loop calls an LLM gateway and two MCP servers, which read a Groq model, a SQLite database and a vector index built by the corpus ingest. Outside clients may call the help-centre server. People review drafts, work escalations and report wrong answers; a report becomes a regression case in the next eval run. Tracing and redaction span every hop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
</defs>
<rect width="920" height="840" fill="#FFFFFF"/>

<!-- Clients -->
<g class="gray"><rect x="30" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="48" text-anchor="middle" dominant-baseline="central">Angular workspace</text>
<text class="ts" x="130" y="66" text-anchor="middle" dominant-baseline="central">queue, review, label, data</text></g>
<g class="gray"><rect x="260" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="360" y="48" text-anchor="middle" dominant-baseline="central">CLI and eval suite</text>
<text class="ts" x="360" y="66" text-anchor="middle" dominant-baseline="central">python -m tier1</text></g>
<g class="gray"><rect x="30" y="116" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="134" text-anchor="middle" dominant-baseline="central">FastAPI routers</text>
<text class="ts" x="130" y="152" text-anchor="middle" dominant-baseline="central">auth, rate limit, job polling</text></g>
<g class="gray"><rect x="490" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="590" y="48" text-anchor="middle" dominant-baseline="central">Preflight</text>
<text class="ts" x="590" y="66" text-anchor="middle" dominant-baseline="central">tier1 up and /api/ready</text></g>

<line x1="130" y1="86" x2="130" y2="114" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="172" x2="130" y2="204" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="86" x2="360" y2="204" class="arr" marker-end="url(#arrow)"/>

<!-- Single entry point -->
<g class="purple"><rect x="30" y="206" width="660" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="360" y="226" text-anchor="middle" dominant-baseline="central">Single entry point: handle_ticket()</text></g>
<g class="teal"><rect x="46" y="244" width="145" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="118.5" y="262" text-anchor="middle" dominant-baseline="central">Pre-guard</text>
<text class="ts" x="118.5" y="280" text-anchor="middle" dominant-baseline="central">no model call, $0</text></g>
<g class="teal"><rect x="207" y="244" width="145" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="279.5" y="262" text-anchor="middle" dominant-baseline="central">Prefetch</text>
<text class="ts" x="279.5" y="280" text-anchor="middle" dominant-baseline="central">entitlement, search</text></g>
<g class="teal"><rect x="368" y="244" width="145" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="440.5" y="262" text-anchor="middle" dominant-baseline="central">Agent loop</text>
<text class="ts" x="440.5" y="280" text-anchor="middle" dominant-baseline="central">6 laps, 14k tokens</text></g>
<g class="teal"><rect x="529" y="244" width="145" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="601.5" y="262" text-anchor="middle" dominant-baseline="central">Post-guard</text>
<text class="ts" x="601.5" y="280" text-anchor="middle" dominant-baseline="central">citations, windows</text></g>
<line x1="191" y1="272" x2="205" y2="272" class="arr" marker-end="url(#arrow)"/>
<line x1="352" y1="272" x2="366" y2="272" class="arr" marker-end="url(#arrow)"/>
<line x1="513" y1="272" x2="527" y2="272" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="46" y="314" width="628" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="360" y="329" text-anchor="middle" dominant-baseline="central">ANSWER only if every check passes, else ESCALATE with a handoff row and the draft kept</text></g>

<!-- Catalog -->
<g class="gray"><rect x="720" y="206" width="170" height="150" rx="8" stroke-width="0.5"/>
<text class="th" x="805" y="226" text-anchor="middle" dominant-baseline="central">Catalog</text>
<text class="ts" x="805" y="248" text-anchor="middle" dominant-baseline="central">data/catalog.db</text>
<text class="ts" x="805" y="272" text-anchor="middle" dominant-baseline="central">versioned prompts</text>
<text class="ts" x="805" y="290" text-anchor="middle" dominant-baseline="central">guard rules, test-gated</text>
<text class="ts" x="805" y="308" text-anchor="middle" dominant-baseline="central">settings, prices</text>
<text class="ts" x="805" y="326" text-anchor="middle" dominant-baseline="central">eval cases, labels</text></g>
<line x1="720" y1="281" x2="692" y2="281" class="arr" marker-end="url(#arrow)"/>

<!-- Services the agent loop calls -->
<line x1="130" y1="356" x2="130" y2="398" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="356" x2="360" y2="398" class="arr" marker-end="url(#arrow)"/>
<line x1="590" y1="356" x2="590" y2="398" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="368" y="377" dominant-baseline="central" fill="#5F5E5A">MCP over stdio, allow-listed</text>

<g class="teal"><rect x="30" y="400" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="418" text-anchor="middle" dominant-baseline="central">LLM gateway</text>
<text class="ts" x="130" y="436" text-anchor="middle" dominant-baseline="central">cache, token limiter, retries</text></g>
<g class="teal"><rect x="260" y="400" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="360" y="418" text-anchor="middle" dominant-baseline="central">MCP: tier1-tools</text>
<text class="ts" x="360" y="436" text-anchor="middle" dominant-baseline="central">order, entitlement, escalate</text></g>
<g class="teal"><rect x="490" y="400" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="590" y="418" text-anchor="middle" dominant-baseline="central">MCP: help-centre</text>
<text class="ts" x="590" y="436" text-anchor="middle" dominant-baseline="central">hybrid search, version filter</text></g>
<g class="gray"><rect x="720" y="400" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="805" y="418" text-anchor="middle" dominant-baseline="central">Outside MCP clients</text>
<text class="ts" x="805" y="436" text-anchor="middle" dominant-baseline="central">search only</text></g>
<line x1="720" y1="428" x2="692" y2="428" class="arr" marker-end="url(#arrow)"/>

<line x1="130" y1="456" x2="130" y2="488" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="456" x2="360" y2="488" class="arr" marker-end="url(#arrow)"/>
<line x1="590" y1="456" x2="590" y2="488" class="arr" marker-end="url(#arrow)"/>

<!-- Stored data and providers -->
<g class="gray"><rect x="30" y="490" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="508" text-anchor="middle" dominant-baseline="central">Groq model API</text>
<text class="ts" x="130" y="526" text-anchor="middle" dominant-baseline="central">agent gpt-oss, judge qwen</text></g>
<g class="gray"><rect x="260" y="490" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="360" y="508" text-anchor="middle" dominant-baseline="central">SQLite tier1.db</text>
<text class="ts" x="360" y="526" text-anchor="middle" dominant-baseline="central">tickets, handoffs, jobs, spans</text></g>
<g class="gray"><rect x="490" y="490" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="590" y="508" text-anchor="middle" dominant-baseline="central">Vector index</text>
<text class="ts" x="590" y="526" text-anchor="middle" dominant-baseline="central">Chroma plus BM25, RRF</text></g>
<g class="teal"><rect x="720" y="490" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="805" y="508" text-anchor="middle" dominant-baseline="central">Corpus ingest</text>
<text class="ts" x="805" y="526" text-anchor="middle" dominant-baseline="central">synthetic, chunked</text></g>
<line x1="720" y1="518" x2="692" y2="518" class="arr" marker-end="url(#arrow)"/>

<!-- People in the loop -->
<rect x="30" y="576" width="860" height="110" rx="12" fill="#FFFBF3" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="460" y="594" text-anchor="middle" dominant-baseline="central" fill="#633806">People in the loop and the closed failure-to-test loop</text>

<text class="th" x="460" y="630" text-anchor="middle" dominant-baseline="central">Feedback report</text>
<text class="ts" x="460" y="648" text-anchor="middle" dominant-baseline="central">answer marked wrong</text></g>
<g class="amber"><rect x="555" y="612" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="630" y="630" text-anchor="middle" dominant-baseline="central">Regression case</text>
<text class="ts" x="630" y="648" text-anchor="middle" dominant-baseline="central">saved to the catalog</text></g>
<g class="amber"><rect x="725" y="612" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="800" y="630" text-anchor="middle" dominant-baseline="central">Next eval run</text>
<text class="ts" x="800" y="648" text-anchor="middle" dominant-baseline="central">judge, human labels</text></g>
<line x1="535" y1="640" x2="553" y2="640" class="arr" marker-end="url(#arrow)"/>
<line x1="705" y1="640" x2="723" y2="640" class="arr" marker-end="url(#arrow)"/>

<!-- Cross-cutting -->
<rect x="30" y="706" width="860" height="72" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="460" y="724" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Tracing and PII redaction on every hop</text>
<text class="ts" x="460" y="744" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">One trace_id across the API, the agent and both MCP servers; a span per step in tier1.db; Langfuse; alert emails</text>
<text class="ts" x="460" y="762" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">redact() at every sink; customer names and emails masked on lists and dashboards</text>

<text class="ts" x="30" y="808" fill="#5F5E5A">Purple: the single entry point. Teal: logic we wrote. Amber: people in the loop. Gray: clients, checks and stored data.</text>
</svg>
